[general]
static=yes

[insurer]
exten => _700[1-5],1,Answer()
 same => n,Set(TIMEOUT(absolute)=45)
 same => n,Wait(1)
 same => n,GotoIf($["${EXTEN}"="7001"]?transport)
 same => n,Set(MENU_FILE=${IF($["${EXTEN}"="7005"]?menu-changed:menu)})
 same => n,Playback(/var/lib/asterisk/sounds/claimcall/${MENU_FILE})
 same => n,Playtones(1520)
 same => n,Wait(0.3)
 same => n,StopPlaytones()
 same => n,Read(CHOICE,,1,,1,25)
 same => n,GotoIf($["${EXTEN}"="7005"]?changed)
 same => n,Goto(route)
 same => n(transport),Read(CHOICE,/var/lib/asterisk/sounds/claimcall/menu,1,,2,6)
 same => n(route),NoOp(Checking menu selection)
 same => n,GotoIf($["${CHOICE}"="2"]?accepted:done)
 same => n(changed),GotoIf($["${CHOICE}"="3"]?accepted:done)
 same => n(accepted),Playtones(660)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,GotoIf($[${EXTEN}>=7004]?done)
 same => n,GotoIf($["${EXTEN}"="7003"]?paid)
 same => n,GotoIf($["${EXTEN}"="7002"]?pending)
 same => n,Echo()
 same => n,Goto(done)
 same => n(pending),Gosub(exchange-turn,s,1(question,pending))
 same => n,Goto(done)
 same => n(paid),Set(TIMEOUT(absolute)=90)
 same => n,Gosub(exchange-turn,s,1(question,paid))
 same => n,Gosub(exchange-turn,s,1(clarify-1,digits))
 same => n,Gosub(exchange-turn,s,1(clarify-2,positions))
 same => n(done),Wait(1)
 same => n,Hangup()

exten => h,1,Verbose(0,CLAIMCALL_MENU_EXIT digit=[${CHOICE}])

[exchange-turn]
exten => s,1,Record(/tmp/claimcall-${ARG1}.wav,0,20,q)
 same => n,GotoIf($["${RECORD_STATUS}"!="DTMF"]?failed)
 same => n,Playtones(1200)
 same => n,Wait(0.3)
 same => n,StopPlaytones()
 same => n,Wait(0.2)
 same => n,Playback(/var/lib/asterisk/sounds/claimcall/${ARG2})
 same => n,Playtones(1400)
 same => n,Wait(0.5)
 same => n,StopPlaytones()
 same => n,Return()
 same => n(failed),Hangup()
