[general]
static=yes

[insurer]
exten => _700[12],1,Answer()
 same => n,Set(TIMEOUT(absolute)=45)
 same => n,Wait(1)
 same => n,Read(CHOICE,/var/lib/asterisk/sounds/claimcall/menu,1,,2,6)
 same => n,GotoIf($["${CHOICE}"="2"]?accepted:done)
 same => n(accepted),Playtones(660)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,GotoIf($["${EXTEN}"="7002"]?question)
 same => n,Echo()
 same => n,Goto(done)
 same => n(question),Record(/tmp/claimcall-question.wav,0,20,q)
 same => n,GotoIf($["${RECORD_STATUS}"!="DTMF"]?done)
 same => n,Playtones(1200)
 same => n,Wait(0.3)
 same => n,StopPlaytones()
 same => n,Wait(0.2)
 same => n,Playback(/var/lib/asterisk/sounds/claimcall/pending)
 same => n,Playtones(1400)
 same => n,Wait(0.5)
 same => n,StopPlaytones()
 same => n,Wait(1)
 same => n(done),Hangup()
